{% extends 'base.html' %}

{% block title %}Create Donation Request - Blood Management System{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-plus-circle"></i> Create Donation Request</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="blood_bank" class="form-label">Blood Bank</label>
                        <select class="form-select" id="blood_bank" name="blood_bank" required>
                            <option value="">Select Blood Bank</option>
                            {% for bank in blood_banks %}
                            <option value="{{ bank.id }}">{{ bank.name }} - {{ bank.city }}, {{ bank.state }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="blood_group" class="form-label">Blood Group</label>
                        <select class="form-select" id="blood_group" name="blood_group" required>
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="units_requested" class="form-label">Units Requested</label>
                        <input type="number" class="form-control" id="units_requested" name="units_requested" 
                               min="1" max="10" value="1" required>
                        <small class="text-muted">Maximum 10 units per request</small>
                    </div>
                    <div class="mb-3">
                        <label for="request_date" class="form-label">Request Date</label>
                        <input type="date" class="form-control" id="request_date" name="request_date" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle"></i> Submit Request
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Set minimum date to today
    document.getElementById('request_date').min = new Date().toISOString().split('T')[0];
</script>
{% endblock %}
