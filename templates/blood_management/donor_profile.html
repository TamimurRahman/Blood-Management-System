{% extends 'base.html' %}

{% block title %}Donor Profile - Blood Management System{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-person"></i> Donor Profile</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <h5 class="mb-3">Personal Information</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first_name" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" 
                                   value="{{ user.first_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last_name" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" 
                                   value="{{ user.last_name }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   value="{{ user.email }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="phone_number" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone_number" name="phone_number" 
                                   value="{{ user.phone_number }}">
                        </div>
                    </div>

                    <hr>
                    <h5 class="mb-3">Donor Information</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="blood_group" class="form-label">Blood Group</label>
                            <select class="form-select" id="blood_group" name="blood_group">
                                <option value="">Select Blood Group</option>
                                <option value="A+" {% if donor.blood_group == 'A+' %}selected{% endif %}>A+</option>
                                <option value="A-" {% if donor.blood_group == 'A-' %}selected{% endif %}>A-</option>
                                <option value="B+" {% if donor.blood_group == 'B+' %}selected{% endif %}>B+</option>
                                <option value="B-" {% if donor.blood_group == 'B-' %}selected{% endif %}>B-</option>
                                <option value="AB+" {% if donor.blood_group == 'AB+' %}selected{% endif %}>AB+</option>
                                <option value="AB-" {% if donor.blood_group == 'AB-' %}selected{% endif %}>AB-</option>
                                <option value="O+" {% if donor.blood_group == 'O+' %}selected{% endif %}>O+</option>
                                <option value="O-" {% if donor.blood_group == 'O-' %}selected{% endif %}>O-</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="date_of_birth" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" 
                                   value="{% if donor %}{{ donor.date_of_birth|date:'Y-m-d' }}{% endif %}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" name="address" rows="2">{% if donor %}{{ donor.address }}{% endif %}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" name="city" 
                                   value="{% if donor %}{{ donor.city }}{% endif %}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="state" class="form-label">State</label>
                            <input type="text" class="form-control" id="state" name="state" 
                                   value="{% if donor %}{{ donor.state }}{% endif %}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="zip_code" class="form-label">Zip Code</label>
                            <input type="text" class="form-control" id="zip_code" name="zip_code" 
                                   value="{% if donor %}{{ donor.zip_code }}{% endif %}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="last_donation_date" class="form-label">Last Donation Date</label>
                            <input type="date" class="form-control" id="last_donation_date" name="last_donation_date" 
                                   value="{% if donor %}{{ donor.last_donation_date|date:'Y-m-d' }}{% endif %}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="form-check mt-4">
                                <input class="form-check-input" type="checkbox" id="is_available" name="is_available" 
                                       {% if donor and donor.is_available %}checked{% endif %}>
                                <label class="form-check-label" for="is_available">
                                    Available for Donation
                                </label>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Save Profile
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
